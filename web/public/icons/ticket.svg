<?xml version="1.0" encoding="UTF-8"?>
<!-- Ticket de relleno para la demo. Es solo un dibujo: en el contrato un ticket
     es un numero, no una cosa que se pueda mandar ni ver en la wallet.
     Para cambiarlo, reemplazar este archivo por el arte definitivo. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240" role="img" aria-label="Primal Cult raffle ticket">
  <defs>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2233E8"/>
      <stop offset="55%" stop-color="#1322D3"/>
      <stop offset="100%" stop-color="#0D1899"/>
    </linearGradient>
    <linearGradient id="brillo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#050427" flood-opacity="0.65"/>
    </filter>

    <!-- Las muescas son agujeros de verdad: se recortan del ticket para que se
         vea el fondo de la pagina a traves. -->
    <mask id="muescas">
      <rect x="0" y="0" width="600" height="240" fill="#000"/>
      <rect x="40" y="28" width="520" height="184" rx="18" fill="#fff"/>
      <circle cx="424" cy="28" r="17" fill="#000"/>
      <circle cx="424" cy="212" r="17" fill="#000"/>
    </mask>
  </defs>

  <g filter="url(#sombra)" mask="url(#muescas)">
    <rect x="40" y="28" width="520" height="184" rx="18" fill="url(#cuerpo)"/>
    <rect x="40" y="28" width="520" height="184" rx="18" fill="url(#brillo)"/>
    <rect x="40.5" y="28.5" width="519" height="183" rx="17.5" fill="none" stroke="#7C8BFF" stroke-opacity="0.45"/>
  </g>

  <!-- Perforacion -->
  <line x1="424" y1="54" x2="424" y2="186" stroke="#FDE047" stroke-opacity="0.55" stroke-width="2.5" stroke-dasharray="7 9" stroke-linecap="round"/>

  <!-- Cuerpo: marca y tipo de ticket -->
  <g fill="#FDE047">
    <rect x="76" y="66" width="34" height="4" rx="2"/>
  </g>
  <text x="76" y="112" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="38" font-weight="800" letter-spacing="3" fill="#ffffff">PRIMAL CULT</text>
  <text x="77" y="143" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="600" letter-spacing="7" fill="#FDE047" fill-opacity="0.95">RAFFLE TICKET</text>
  <text x="77" y="178" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="500" letter-spacing="2.5" fill="#C7D0FF" fill-opacity="0.75">ONE ENTRY &#183; ONE WINNER</text>

  <!-- Talon -->
  <g transform="translate(492 120)">
    <circle r="31" fill="#090746" fill-opacity="0.55" stroke="#FDE047" stroke-opacity="0.5" stroke-width="2"/>
    <text x="0" y="11" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="30" font-weight="800" fill="#FDE047">P</text>
  </g>
  <text x="492" y="176" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="10" font-weight="600" letter-spacing="3" fill="#C7D0FF" fill-opacity="0.7">ADMIT ONE</text>
</svg>
